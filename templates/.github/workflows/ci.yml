name: CI

# The PR gate. Pull requests run it directly; pushes to main run it through
# main.yml before anything deploys. Add one job per package, each running the
# same commands AGENTS.md lists under "Before saying something works".
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Example: a Bun/TypeScript package. Replace or duplicate per package.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # Committed generated code must match a fresh run, or the PR fails.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run codegen   # <your generator>
      - run: git add -A && git diff --cached --exit-code

  # The docs site must build, so a broken link or page fails here.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

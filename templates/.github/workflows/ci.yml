name: CI

# The PR gate. Pull requests run it directly; pushes to main run it through
# main.yml before anything deploys. Add one job per package, each running the
# same commands AGENTS.md lists under "Before saying something works".
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Keyed on the PR number, so it
# never touches the run main.yml calls (that one gets a unique run id).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Example: a Bun/TypeScript package. Replace or duplicate per package.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Lint blocks. If you must start report-only (`|| true`), write down why
      # and the issue that makes it blocking, here and in docs/engineering/ci-cd.md.
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # Committed generated code must match a fresh run, or the PR fails.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run codegen   # <your generator>
      - run: git add -A && git diff --cached --exit-code

  # The docs site must build, so a broken link or page fails here.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build

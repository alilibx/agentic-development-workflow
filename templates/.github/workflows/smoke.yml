name: Smoke

# Loads the main pages in a headless browser and fails on a blank page, an
# uncaught error, a console error or a non-2xx document. A green deploy step
# has shipped a blank page before; this is the check that a person would
# otherwise make by hand.
#
# Triggers:
#   - workflow_call: main.yml runs it after each staging and production deploy.
#   - schedule: every morning, for both tiers, for what breaks without a deploy
#     (an auth provider setting, an expired domain, a third-party script).
#   - workflow_dispatch: on demand, for one tier or one URL. Pointing it at a
#     known-broken URL proves the failure alert reaches a phone.
#
# Base URLs are repository variables APP_URL_STAGING and APP_URL_PRODUCTION.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
  schedule:
    - cron: "0 5 * * *"   # <before your working day starts, in UTC>
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      url:
        description: "Optional: check this URL instead of the tier's base URL"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The schedule checks both tiers; a call or dispatch checks one.
        environment: ${{ github.event_name == 'schedule' && fromJSON('["staging","production"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      URL: ${{ inputs.url != '' && inputs.url || vars[format('APP_URL_{0}', matrix.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Browser smoke
        timeout-minutes: 10
        run: |
          : "${URL:?variable APP_URL_* is not set for $ENVIRONMENT}"
          bun run smoke "$URL"   # <e.g. a Playwright script that opens each main page>

  alert:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      # Only failures page. A passing smoke is already covered by the deploy heartbeat.
      - if: needs.smoke.result != 'success'
        uses: ./.github/actions/notify
        with:
          topic: ${{ secrets.NOTIFY_TOPIC }}
          title: ${{ format('smoke {0}', needs.smoke.result) }}
          message: ${{ format('{0} smoke, triggered by {1}', github.event_name == 'schedule' && 'daily' || inputs.environment, github.event_name) }}
          priority: urgent

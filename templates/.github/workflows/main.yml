name: Main

# Every push to main: check, deploy to staging, then let release-please open or
# update the release PR. Merging that PR tags vX.Y.Z and publishes a GitHub
# release, and the same run deploys the tag to production. Production only
# gets code that reached staging first.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit

  release:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4  # pin to a commit SHA in your repo
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # In this run, not on the tag push: tags created with GITHUB_TOKEN don't
  # start other workflows.
  production:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
